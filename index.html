<!DOCTYPE html>
<html lang="es">
<head>

<title>Tengohambrewe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:800px;
}

.card{
    background:white;
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    animation:fadeIn 1s ease;
}

h1{
    color:#ff4d6d;
    margin-bottom:20px;
}

p{
    font-size:1.2rem;
    color:#555;
    margin-bottom:25px;
    line-height:1.6;
}

img{
    width:100%;
    max-width:400px;
    border-radius:20px;
    margin:20px auto;
    display:block;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    background:#ff4d6d;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ff3358;
}

.botones{
    display:flex;
    justify-content: center;
    gap:15px;
    margin-top:20px;
}

.hidden{
    display:none;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    position:absolute;
    color:white;
    font-size:20px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }

    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

#regaloFinal:hover{
    transform:scale(1.05);
}

</style>
</head>

function crearCorazon(){

}

</script>

</html>
